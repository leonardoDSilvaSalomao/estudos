<!DOCTYPE html>
        <!-- lang declara o idioma da página web. -->
<html lang="en">
    <head>
        <title>
            001.html
        </title>
    </head>
    <body>
        <!-- O atributo href especifica a URL da página para a qual o link direciona -->
        <a href="..." >
            link
        </a>
        
        <!-- O src atributo especifica o caminho para a imagem a ser exibida. -->
        <!-- Width e height, que especificam a largura e a altura da imagem. -->
        <!-- alt especifica um texto alternativo para uma imagem, caso ela não possa ser exibida por algum motivo. -->
        <img src="..." alt="..." width="500px" height="600px">

        <!-- Usado para adicionar estilos a um elemento, como cor, fonte, tamanho e muito mais. -->
         <!-- Define algumas informações extras sobre um elemento. -->
        <p style="color: red;">
            Esse é um paragrafo
        </p>
        <p title="Eu sou uma dica">
            Esse é um parégrafo
        </p>
    </body>
</html>
