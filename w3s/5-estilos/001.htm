<!DOCTYPE html>
<html>
    <body style="background-color:powderblue">
        <!-- A propriedade CSS "background-color" define a cor de fundo de um elemento html -->
        <h1 style="background-color:aliceblue">
            Isso è um  titulo
        </h1>
        <p style="background-color:blueviolet">
            Isso é um paragráfo
        </p>
        <!-- A propriedade CSS "color" define a cor de um texto -->
        <h2 style="color:yellow">
            Isso é um subtitulo
        </h2>
        <p style="color:brown">
            Isso é um paragráfo
        </p>
        <!-- A propriedade CSS "font-family" define a fonte a ser usada para um elemento HTML -->
        <h2 style="font-family:verdana;">
            Isso é um subtitulo
        </h2>
        <p style="font-family:courier;">
            Isso é um paragrafo
        </p>
        <!-- A propriedade CSS "font-size" define o tamanho do texto para um elemento HTML -->
        <h2 style="font-size: 300%;">
            Isso é um subtitulo
        </h2>
        <p style="font-size:160%;">
            Isso é um paragrafo
        </p>
        <!-- A propriedade CSS "text-align" define o lainhamento horixzontal dao texto para um elemento HTML -->
        <h2 style="text-align:center;">
            Isso é um subtitulo
        </h2>
        <p style="text-align:center;">
            Isso é um paragrafo
        </p>
    </body>
</html>
